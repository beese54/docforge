# OpenShell policy for the docforge agent sandbox (sandbox/run-agent.sh). Verified by sandbox/redteam.sh.
# Static (fixed at creation): filesystem + landlock. Network comes ONLY from the attached `anthropic`
# provider profile (sandbox/anthropic-profile.yaml): api.anthropic.com:443 for curl/python3, with the real
# key injected at egress. No other network rule exists, so all other egress is denied.
version: 1

filesystem_policy:
  # /sandbox holds a COPY of the repository plus /sandbox/out; writes there cannot reach the host repo, and
  # the only thing that leaves the sandbox is /sandbox/out, whose patch `docforge apply` re-checks path by
  # path. Uploads also run under this policy, so /sandbox must be writable. Everything else is read-only.
  include_workdir: true
  read_only: [/bin, /usr, /lib, /proc, /dev/urandom, /etc, /var/log, /home/sandbox/.gitconfig]
  read_write: [/sandbox, /tmp, /dev/null]

landlock:
  compatibility: best_effort

network_policies: {}
